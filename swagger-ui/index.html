<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Telegraph Protocol API — interactive OpenAPI documentation. Five specs covering the miner-dispatcher HTTP proxy, Engine + Daemon HTTP/WS, internal TSS bridge node-ops, and the legacy proxy." />
  <title>Telegraph Protocol API · Swagger UI</title>
  <link rel="icon" type="image="png" href="favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16" />
  <link rel="stylesheet" type="text/css" href="swagger-ui.css" />
  <link rel="stylesheet" type="text/css" href="index.css" />
  <style>
    html { box-sizing: border-box; }
    *, *::before, *::after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }

    /* Branding bar (our own, above Swagger UI) */
    .telegraph-topbar {
      background: #0f172a;
      color: #e2e8f0;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      border-bottom: 1px solid #1e293b;
    }
    .telegraph-topbar .brand {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.2px;
      color: #fff;
      white-space: nowrap;
    }
    .telegraph-topbar .brand .accent { color: #38bdf8; }
    .telegraph-topbar .tagline {
      font-size: 13px;
      color: #94a3b8;
      white-space: nowrap;
    }
    .telegraph-topbar .spacer { flex: 1 1 auto; }
    .telegraph-topbar a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
    }
    .telegraph-topbar a:hover { text-decoration: underline; }

    /* Style the Swagger UI topbar (contains the spec-switcher dropdown)
       instead of hiding it — this is where users switch between the 5 specs. */
    .swagger-ui .topbar {
      background: #1e293b !important;
      padding: 8px 24px !important;
      border-bottom: 1px solid #334155 !important;
    }
    .swagger-ui .topbar .wrapper { padding: 0 !important; }
    .swagger-ui .topbar select {
      background: #0f172a !important;
      color: #e2e8f0 !important;
      border: 1px solid #475569 !important;
      border-radius: 6px !important;
      padding: 6px 12px !important;
      font-size: 14px !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
      cursor: pointer !important;
      outline: none !important;
    }
    .swagger-ui .topbar select:focus {
      border-color: #38bdf8 !important;
    }
    .swagger-ui .topbar select option {
      background: #1e293b !important;
      color: #e2e8f0 !important;
    }
    .swagger-ui .topbar .download-url-button,
    .swagger-ui .topbar .download-url-input {
      display: none !important;
    }
    .swagger-ui .info { margin-top: 12px; }
  </style>
</head>
<body>
  <div class="telegraph-topbar">
    <span class="brand">Telegraph<span class="accent">.</span>API</span>
    <span class="tagline">Permissionless marketplace for verifiable AI inference</span>
    <span class="spacer"></span>
    <a href="https://github.com/0xWick/Telegraph-api-docs" target="_blank" rel="noopener">GitHub Repo</a>
    <a href="specs/miner-dispatcher.yaml" target="_blank" rel="noopener">Raw Specs</a>
  </div>

  <div id="swagger-ui"></div>

  <script src="swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    (function () {
      // The 5 OpenAPI specs. The topbar dropdown (rendered by Swagger UI's
      // StandaloneLayout) lets users switch between them. The first entry
      // loads by default.
      var specs = [
        { name: "Miner Dispatcher (x402 inference proxy)",  url: "specs/miner-dispatcher.yaml" },
        { name: "Engine REST + WebSocket",                  url: "specs/engine.yaml" },
        { name: "Daemon Dashboard Read API",                url: "specs/daemon.yaml" },
        { name: "Internal Bridge / Node Ops (TSS)",         url: "specs/internal-bridge.yaml" },
        { name: "Legacy Proxy (deprecated)",                url: "specs/bittensor-legacy.yaml" }
      ];

      // Persist the chosen spec across reloads via the ?spec= query param.
      var params = new URLSearchParams(window.location.search);
      var requested = params.get("spec");
      var defaultUrl = specs[0].url;
      if (requested) {
        var match = specs.find(function (s) { return s.url.indexOf(requested) !== -1; });
        if (match) defaultUrl = match.url;
      }

      window.onload = function () {
        var ui = SwaggerUIBundle({
          urls: specs,
          url: defaultUrl,
          dom_id: "#swagger-ui",
          deepLinking: true,
          docExpansion: "list",
          defaultModelsExpandDepth: 1,
          defaultModelExpandDepth: 1,
          filter: true,
          showExtensions: true,
          showCommonExtensions: true,
          syntaxHighlight: { active: true, theme: "agate" },
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          plugins: [
            SwaggerUIBundle.plugins.DownloadUrl
          ],
          layout: "StandaloneLayout",
          onComplete: function () {
            // Sync the URL ?spec= param when the user switches specs.
            var select = document.querySelector(".swagger-ui select");
            if (select && !select._tcBound) {
              select._tcBound = true;
              select.addEventListener("change", function (e) {
                var chosen = e.target.options[e.target.selectedIndex].text;
                var match = specs.find(function (s) { return s.name === chosen; });
                if (match) {
                  var key = match.url.replace("specs/", "").replace(".yaml", "");
                  var u = new URL(window.location.href);
                  u.searchParams.set("spec", key);
                  window.history.replaceState({}, "", u.toString());
                }
              });
            }
          }
        });
        window.ui = ui;
      };
    })();
  </script>
</body>
</html>
