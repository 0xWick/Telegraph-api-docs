  # ------------------------------------------------------------------
  # Validation (uses X-Internal-Secret, not x402)
  # ------------------------------------------------------------------
  /validate:
    post:
      operationId: validateMinerYaml
      summary: Sandbox-test a miner integration YAML + API key
      description: |
        Validates a miner's integration YAML against the schema AND
        sandbox-tests the provided API key against every endpoint defined in
        the YAML (makes real HTTP calls to the upstream). On full success,
        persists the API key to the `miner_api_keys` table so the miner can
        go live immediately after on-chain registration.

        Auth: `X-Internal-Secret` header (shared `INTERNAL_SECRET` env var).
        If `INTERNAL_SECRET` is unset, auth is disabled (dev-only).
      tags: [Validation]
      security:
        - internalSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
            example:
              yaml: "slug: bittensor-sn18-zeus\nname: Zeus Weather Forecasting\n..."
              api_key: sk-zeus-abc123
      responses:
        '200':
          description: Validation result (check `valid` and `api_key_stored` fields).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateResponse'
              example:
                valid: true
                slug: bittensor-sn18-zeus
                name: Zeus Weather Forecasting
                api_key_stored: true
                results:
                  - path: /predict
                    method: GET
                    status: 200
                    success: true
                    latency_ms: 412
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /validate/collector:
    post:
      operationId: validateCollectorYaml
      summary: Schema-validate a collector YAML (no HTTP testing)
      description: |
        Schema-only validation of a collector YAML — does NOT make HTTP calls
        to any upstream. Returns the derived slug, name, and any schema errors.

        Auth: `X-Internal-Secret` header.
      tags: [Validation]
      security:
        - internalSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCollectorRequest'
            example:
              yaml: "slug: news-collector\nname: News Collector\n..."
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateCollectorResponse'
              example:
                valid: true
                slug: news-collector
                name: News Collector
                errors: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
