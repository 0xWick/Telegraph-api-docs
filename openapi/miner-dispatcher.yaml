  # ------------------------------------------------------------------
  # Zeus Weather (id: 18, slug: bittensor-sn18-zeus)
  # ------------------------------------------------------------------
  /v1/bittensor-sn18-zeus/predict:
    get:
      operationId: zeus_predict
      summary: Zeus Weather — GET /predict
      description: |
        Single-point hourly weather forecast. Pass lat/lon and an ERA5 short
        variable name in `hourly` (or the alias `variable`, e.g. `2t` for
        2 m temperature). Set `forecast_hours` for the horizon length
        (default 24).
      tags: [Zeus Weather]
      security:
        - x402: []
      x-telegraph:
        payment: x402
        slug: bittensor-sn18-zeus
        miner_id: "18"
        signal_mapping:
          type: weather_risk
          label_field: model
      parameters:
        - name: lat
          in: query
          required: true
          description: Latitude of the forecast location.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          required: true
          description: Longitude of the forecast location.
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: hourly
          in: query
          required: false
          description: "ERA5 short variable name (e.g. '2t', '2d', '100u', '100v')."
          schema: { type: string }
        - name: variable
          in: query
          required: false
          description: "Alias for 'hourly'."
          schema: { type: string }
        - name: forecast_hours
          in: query
          required: false
          description: "Number of hours ahead to forecast (default 24)."
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Weather forecast response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  latitude: { type: number }
                  longitude: { type: number }
                  model: { type: string, description: "Model name (e.g. 'zeus')." }
                  reference_time: { type: string, description: "ISO 8601 reference time." }
                  hourly:
                    type: object
                    description: "Hourly forecast data with 'time' array and variable arrays."
                    properties:
                      time:
                        type: array
                        items: { type: string }
                        description: "ISO 8601 timestamps."
              example:
                latitude: 25.2
                longitude: 55.3
                model: zeus
                hourly:
                  time: ["2026-07-03T00:00", "2026-07-03T01:00"]
                  "2t": [305.1, 304.8]
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'

