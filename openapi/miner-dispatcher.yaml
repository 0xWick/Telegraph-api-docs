openapi: 3.0.3
info:
  title: Telegraph Miner Dispatcher API
  version: 2.0.0
  description: |
    The **miner-dispatcher** is the x402-gated HTTP proxy that fronts all
    registered miner integrations on a Telegraph node. It is the primary
    inference marketplace surface: Agents pay USDC via the x402 protocol
    (HTTP 402 challenge-response) and receive verified inference from the
    requested miner.

    ## Authentication — x402 Payment

    No API keys. The payment IS the authentication.

    1. Send your request normally (no `PAYMENT-SIGNATURE` header).
    2. Receive `402 Payment Required` with a JSON body listing the acceptable
       payment scheme, price (in 6-decimal USDC units), network
       (Base Sepolia / Solana Devnet), and receiving address.
    3. Submit the USDC payment on-chain.
    4. Retry the original request with the `PAYMENT-SIGNATURE` header set to
       the base64-encoded payment proof — receive the inference result.

    Prices vary per miner (e.g. Zeus $0.01, BitMind $0.02, OpenAI $0.05).
    Dynamic per-miner pricing reads the on-chain `minPriceUsdc` committed by
    each miner and applies a demand multiplier based on 24h volume.

    ## Discovery endpoints (no payment)

    The `/healthz`, `/integrations`, `/integrations/yamls`, `/openapi.yaml`,
    and `/openapi.json` endpoints are **free** (no x402) — they let Agents
    discover what's available before paying.

    ## Active miners

    | ID | Slug | Name | Capability | Min Price |
    |---|---|---|---|---|
    | 18 | bittensor-sn18-zeus | Zeus Weather Forecasting | Weather forecasting | $0.01 |
    | 34 | bittensor-sn34-bitmind | BitMind Deepfake Detector | Media authenticity | $0.02 |
    | 102 | openai | OpenAI | LLM, images, embeddings, moderation | $0.05 |

    The `bittensor-` prefix on some slugs is historical — every provider is a
    **miner**, whether it's a Bittensor subnet, a hosted model, or a private API.

    > The authoritative live list is always `GET /miner-dispatcher/integrations`
    > — the set of live miners changes as operators register and deregister
    > on-chain.
  contact:
    name: Telegraph Protocol
    url: https://github.com/0xWick/Telegraph
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://13.237.89.59:7044/miner-dispatcher
    description: Telegraph testnet node
  - url: http://localhost:7044/miner-dispatcher
    description: Local development node
tags:
  - name: Discovery
    description: Free discovery, health, and OpenAPI-spec endpoints (no x402).
  - name: Validation
    description: Miner/collector YAML sandbox validation (uses X-Internal-Secret).
  - name: x402 Test
    description: Test endpoint that exercises the x402 payment flow without calling a real miner.
  - name: Dynamic Proxy
    description: The generic x402-gated proxy to any registered miner integration.
  - name: OpenAI
    description: OpenAI API — chat completions, responses, embeddings, image generation, content moderation.
  - name: Zeus Weather
    description: Zeus Weather Forecasting — hourly weather forecasts backed by the Bittensor network.
  - name: BitMind
    description: BitMind Deepfake Detector — detects AI-generated images and videos.
components:
  securitySchemes:
    x402:
      $ref: ../components/security/x402.yaml
    internalSecret:
      $ref: ../components/security/internalSecret.yaml
  responses:
    PaymentRequired:
      description: Payment required — submit x402 USDC payment and retry.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/X402ChallengeBody.yaml
    BadRequest:
      description: The request was malformed (invalid JSON, missing required field, bad parameter).
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error: "invalid request body: missing required field 'messages'"
            code: invalid_request
    Unauthorized:
      description: The `X-Internal-Secret` header was missing or did not match.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error: "unauthorized: invalid or missing X-Internal-Secret"
            code: unauthorized
    NotFound:
      description: The requested miner or endpoint was not found.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error: "subnet not found"
            code: not_found
    BadGateway:
      description: The upstream miner returned an error or was unreachable.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
          example:
            error: "upstream error: 503 from openai"
            code: upstream_error
    InternalServerError:
      description: Unexpected internal server error.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
  parameters:
    MinerPath:
      name: miner
      in: path
      required: true
      description: |
        Miner identifier. Accepts either the numeric ID (`18`, `34`, `102`)
        or the slug (`openai`, `bittensor-sn18-zeus`, `bittensor-sn34-bitmind`).
        For a full list of live miners, call `GET /integrations`.
      schema:
        type: string
        example: openai
    ProxyPath:
      name: proxyPath
      in: path
      required: true
      description: |
        The sub-endpoint path to forward to the upstream miner, including
        the leading slash. Example: `/chat`, `/predict`, `/detect-image`.
      schema:
        type: string
        example: /chat
  schemas:
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant]
          description: The role of the message author.
        content:
          type: string
          description: The message content.
      description: A single chat message (OpenAI-compatible).
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          example: ok
      description: Dispatcher health status.
    IntegrationDTO:
      type: object
      description: A currently-registered miner integration (hot-loaded from YAML).
      properties:
        id:
          type: string
          description: Internal miner ID.
        slug:
          type: string
          description: URL-safe slug (e.g. `openai`, `bittensor-sn18-zeus`).
        name:
          type: string
          description: Human-readable name.
        kind:
          type: string
          description: Integration kind (e.g. `bittensor`, `generic`).
        protocol:
          type: string
          description: Wire protocol (e.g. `rest`, `generic`).
        base_url:
          type: string
          description: Upstream base URL the dispatcher proxies to.
        endpoints:
          type: array
          description: List of exposed endpoints with their schemas.
          items:
            type: object
        signal_mapping:
          type: object
          description: How upstream responses map to Telegraph signals.
        supported_intents:
          type: array
          items:
            type: string
          description: Intent IDs this miner serves.
        on_chain:
          type: object
          description: On-chain encoding metadata (min_price_usdc, transform, fields).
        cost_per_call:
          type: string
          description: Human-readable cost.
        capabilities:
          type: array
          items:
            type: string
    ValidateRequest:
      type: object
      required: [yaml, api_key]
      properties:
        yaml:
          type: string
          description: The full miner integration YAML text to validate.
        api_key:
          type: string
          description: The upstream API key to sandbox-test against the YAML's endpoints.
    ValidateResponse:
      type: object
      required: [valid, api_key_stored]
      properties:
        valid:
          type: boolean
        slug:
          type: string
        name:
          type: string
        errors:
          type: array
          items: { type: string }
        results:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              method: { type: string }
              status: { type: integer }
              success: { type: boolean }
              error: { type: string }
              latency_ms: { type: integer }
        api_key_stored: { type: boolean }
    ValidateCollectorRequest:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
    ValidateCollectorResponse:
      type: object
      required: [valid, slug, name, errors]
      properties:
        valid: { type: boolean }
        slug: { type: string }
        name: { type: string }
        errors:
          type: array
          items: { type: string }
paths:
  # ------------------------------------------------------------------
  # Discovery (free, no x402)
  # ------------------------------------------------------------------
  /healthz:
    get:
      operationId: getHealthz
      summary: Dispatcher health check
      description: Returns the dispatcher health status. Free (no payment).
      tags: [Discovery]
      responses:
        '200':
          description: Dispatcher is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example: { status: ok }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /integrations:
    get:
      operationId: listIntegrations
      summary: List all registered miners
      description: |
        Returns all currently hot-registered miner integrations as DTOs
        (id, slug, kind, protocol, endpoints, schemas, signal mapping,
        supported intents, on-chain metadata). Free (no payment). This is
        the authoritative live list of available miners.
      tags: [Discovery]
      responses:
        '200':
          description: List of miner integrations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IntegrationDTO'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /integrations/yamls:
    get:
      operationId: listIntegrationYamls
      summary: List raw integration YAMLs
      description: Returns the raw YAML text of every registered miner, keyed by slug. Free (no payment).
      tags: [Discovery]
      responses:
        '200':
          description: Map of slug to raw YAML text.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /openapi.yaml:
    get:
      operationId: getOpenApiYaml
      summary: Dynamically generated OpenAPI spec (YAML)
      description: |
        Returns a dynamically-generated OpenAPI 3.0 YAML spec built from the
        currently-registered miners. This is the **live** spec — it reflects
        whatever miners are hot-loaded right now. Free.
      tags: [Discovery]
      responses:
        '200':
          description: OpenAPI 3.0 YAML spec.
          content:
            application/yaml:
              schema: { type: string }
        '500':
          $ref: '#/components/responses/InternalServerError'

  /openapi.json:
    get:
      operationId: getOpenApiJson
      summary: Dynamically generated OpenAPI spec (JSON)
      description: JSON variant of `/openapi.yaml`.
      tags: [Discovery]
      responses:
        '200':
          description: OpenAPI 3.0 JSON spec.
          content:
            application/json:
              schema: { type: object }
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ------------------------------------------------------------------
  # x402 test
  # ------------------------------------------------------------------
  /v1/x402-test:
    get:
      operationId: getX402TestGet
      summary: Test the x402 payment flow (GET)
      description: |
        Verifies the x402 payment gate without calling a real miner. Only
        registered when x402 is enabled. Use this to confirm your payment
        client + facilitator wiring is correct end-to-end.
      tags: [x402 Test]
      security:
        - x402: []
      responses:
        '200':
          description: Payment verified — the gate is working.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  message: { type: string, example: Payment verified }
                  x402_test: { type: boolean, example: true }
                  endpoint: { type: string, example: /v1/x402-test }
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: getX402TestPost
      summary: Test the x402 payment flow (POST)
      description: POST variant of the x402 test endpoint.
      tags: [x402 Test]
      security:
        - x402: []
      responses:
        '200':
          description: Payment verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  message: { type: string, example: Payment verified }
                  x402_test: { type: boolean, example: true }
                  endpoint: { type: string, example: /v1/x402-test }
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ------------------------------------------------------------------
  # Generic dynamic proxy (covers any registered miner)
  # ------------------------------------------------------------------
  /v1/{miner}/{proxyPath}:
    parameters:
      - $ref: '#/components/parameters/MinerPath'
      - $ref: '#/components/parameters/ProxyPath'
    get:
      operationId: proxyToMinerGet
      summary: Dynamic proxy to a miner (GET)
      description: |
        The core x402-gated dynamic proxy. Forwards method, path, query
        params, body, and headers to the upstream miner and returns its
        response. Each request is logged asynchronously.

        Use this generic form for any registered miner — pass the miner
        ID or slug and the sub-endpoint path.

        **Price:** dynamic — reads the on-chain `minPriceUsdc` committed by
        the miner (varies: Zeus $0.01, BitMind $0.02, OpenAI $0.05).
      tags: [Dynamic Proxy]
      security:
        - x402: []
      responses:
        '200':
          description: The upstream miner's response.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
    post:
      operationId: proxyToMinerPost
      summary: Dynamic proxy to a miner (POST)
      description: POST variant of the generic dynamic proxy.
      tags: [Dynamic Proxy]
      security:
        - x402: []
      parameters:
        - $ref: '#/components/parameters/MinerPath'
        - $ref: '#/components/parameters/ProxyPath'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example: { model: gpt-4o-mini, messages: [{ role: user, content: Hello }] }
          multipart/form-data:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: The upstream miner's response.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
    put:
      operationId: proxyToMinerPut
      summary: Dynamic proxy to a miner (PUT)
      description: PUT variant of the generic dynamic proxy.
      tags: [Dynamic Proxy]
      security:
        - x402: []
      parameters:
        - $ref: '#/components/parameters/MinerPath'
        - $ref: '#/components/parameters/ProxyPath'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example: { field: "updated value" }
      responses:
        '200':
          description: The upstream miner's response.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
    delete:
      operationId: proxyToMinerDelete
      summary: Dynamic proxy to a miner (DELETE)
      description: DELETE variant of the generic dynamic proxy.
      tags: [Dynamic Proxy]
      security:
        - x402: []
      parameters:
        - $ref: '#/components/parameters/MinerPath'
        - $ref: '#/components/parameters/ProxyPath'
      responses:
        '200':
          description: The upstream miner's response.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
    patch:
      operationId: proxyToMinerPatch
      summary: Dynamic proxy to a miner (PATCH)
      description: PATCH variant of the generic dynamic proxy.
      tags: [Dynamic Proxy]
      security:
        - x402: []
      parameters:
        - $ref: '#/components/parameters/MinerPath'
        - $ref: '#/components/parameters/ProxyPath'
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
            example: { op: "replace", path: "/status", value: "active" }
      responses:
        '200':
          description: The upstream miner's response.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'

  # ------------------------------------------------------------------
  # OpenAI (id: 102, slug: openai) — LLM, images, embeddings, moderation
  # ------------------------------------------------------------------
  /v1/openai/chat:
    post:
      operationId: openai_chat
      summary: OpenAI — POST /chat (Chat Completions)
      description: |
        OpenAI Chat Completions. Standard messages[]-based interface.
        Supports gpt-4o, gpt-4o-mini, o4-mini.
      tags: [OpenAI]
      security:
        - x402: []
      x-telegraph:
        payment: x402
        slug: openai
        miner_id: "102"
        signal_mapping:
          type: multimodal_response
          label_field: choices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages, model]
              properties:
                model:
                  type: string
                  description: "Model ID — gpt-4o, gpt-4o-mini, o4-mini, o3."
                  example: gpt-4o-mini
                messages:
                  type: array
                  items:
                    $ref: '#/components/schemas/ChatMessage'
                max_tokens: { type: integer, minimum: 1, description: "Maximum completion tokens." }
                temperature: { type: number, minimum: 0, maximum: 2 }
            example:
              model: gpt-4o-mini
              messages:
                - role: user
                  content: Explain Bitcoin in one sentence.
              max_tokens: 100
      responses:
        '200':
          description: Chat completion response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  choices:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: object
                          properties:
                            role: { type: string }
                            content: { type: string }
                        finish_reason: { type: string }
                  id: { type: string }
                  model: { type: string }
                  usage:
                    type: object
                    properties:
                      prompt_tokens: { type: integer }
                      completion_tokens: { type: integer }
                      total_tokens: { type: integer }
              example:
                id: chatcmpl-abc123
                model: gpt-4o-mini
                choices:
                  - finish_reason: stop
                    message:
                      role: assistant
                      content: Bitcoin is a decentralized digital currency...
                usage: { prompt_tokens: 10, completion_tokens: 25, total_tokens: 35 }
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /v1/openai/responses:
    post:
      operationId: openai_responses
      summary: OpenAI — POST /responses (Responses API)
      description: |
        OpenAI Responses API (March 2025). Superset of Chat Completions with
        built-in tool support. Add `"tools":[{"type":"web_search_preview"}]`
        for live web search. Uses `input` (string or array) instead of
        `messages`, `max_output_tokens` instead of `max_tokens`.
      tags: [OpenAI]
      security:
        - x402: []
      x-telegraph:
        payment: x402
        slug: openai
        miner_id: "102"
        signal_mapping:
          type: multimodal_response
          label_field: output_text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model:
                  type: string
                  example: gpt-4o
                input:
                  description: "String prompt or array of message objects [{role, content}]."
                  oneOf:
                    - type: string
                    - type: array
                      items: { type: object }
                max_output_tokens: { type: integer, description: "Maximum output tokens." }
                temperature: { type: number, minimum: 0, maximum: 2 }
                tools:
                  type: array
                  description: "Tool list. E.g. [{\"type\":\"web_search_preview\"}] for live web search."
                  items: { type: object }
            example:
              model: gpt-4o
              input: "What is the current price of Bitcoin?"
              tools: [{ type: web_search_preview }]
      responses:
        '200':
          description: Responses API result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  output_text:
                    type: string
                    description: "Full synthesized text answer."
                  output:
                    type: array
                    description: "Structured output. output[0].content[0].text has the answer."
                    items: { type: object }
                  usage:
                    type: object
                    properties:
                      prompt_tokens: { type: integer }
                      completion_tokens: { type: integer }
                      total_tokens: { type: integer }
              example:
                output_text: "Bitcoin is currently trading at..."
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/openai/embed:
    post:
      operationId: openai_embed
      summary: OpenAI — POST /embed (Embeddings)
      description: |
        Text-to-vector embeddings for RAG and semantic search.
        Use text-embedding-3-small (fast/cheap) or text-embedding-3-large (best quality).
      tags: [OpenAI]
      security:
        - x402: []
      x-telegraph:
        payment: x402
        slug: openai
        miner_id: "102"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model:
                  type: string
                  example: text-embedding-3-small
                  description: "text-embedding-3-small or text-embedding-3-large."
                input:
                  oneOf:
                    - type: string
                    - type: array
                      items: { type: string }
                  description: "Text to embed."
                encoding_format:
                  type: string
                  description: "float (default) or base64."
            example:
              model: text-embedding-3-small
              input: "The quick brown fox jumps over the lazy dog."
      responses:
        '200':
          description: Embedding response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        embedding:
                          type: array
                          items: { type: number }
                        index: { type: integer }
                  model: { type: string }
                  usage:
                    type: object
                    properties:
                      prompt_tokens: { type: integer }
                      total_tokens: { type: integer }
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/openai/images/generate:
    post:
      operationId: openai_images_generate
      summary: OpenAI — POST /images/generate (DALL-E)
      description: |
        DALL-E image generation from text prompt.
        Models: gpt-image-1 (latest), dall-e-3 (1024x1024), dall-e-2.
      tags: [OpenAI]
      security:
        - x402: []
      x-telegraph:
        payment: x402
        slug: openai
        miner_id: "102"
        signal_mapping:
          type: multimodal_response
          label_field: data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, prompt]
              properties:
                model:
                  type: string
                  example: dall-e-3
                  description: "gpt-image-1, dall-e-3, dall-e-2."
                prompt:
                  type: string
                  description: "Text description of the desired image."
                n:
                  type: integer
                  description: "Number of images to generate (1-10)."
                size:
                  type: string
                  description: "Image dimensions — 256x256, 512x512, 1024x1024."
                response_format:
                  type: string
                  description: "url (default) or b64_json."
            example:
