      responses:
        '200':
          description: Logged request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubnetRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/subnets/{id}:
    get:
      operationId: getSubnetConfigAlias
      summary: Get a subnet configuration (legacy alias)
      description: Legacy alias for `GET /api/miners/{id}`.
      tags:
      - Subnets (legacy)
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/SubnetIdPath'
      responses:
        '200':
          description: Subnet config.
          content:
            application/json:
