  /api/subnets/requests/{requestId}:
    get:
      operationId: getRequestByIdAlias
      summary: Fetch a logged subnet request by ID (legacy alias)
      description: Legacy alias for `GET /api/miners/requests/{requestId}`.
      tags:
      - Subnets (legacy)
      deprecated: true
      parameters:
