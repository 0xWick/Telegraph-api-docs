                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      operationId: proxyToSubnetPatchLegacy
      summary: Dynamic proxy to a subnet upstream (legacy, PATCH)
      description: PATCH variant of the legacy dynamic proxy.
      tags:
      - Miners (legacy)
      deprecated: true
      parameters:
      - $ref: '#/components/parameters/SubnetIdPath'
      - $ref: '#/components/parameters/EndpointPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              op: replace
              path: /status
              value: active
      responses:
