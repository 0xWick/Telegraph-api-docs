              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/subnets:
    get:
      operationId: getAvailableSubnetsAlias
      summary: List all enabled subnets (legacy alias /api/subnets)
      description: Legacy alias for `GET /api/miners` — same handler.
      tags:
