# Shared internal secret for inter-component and node-ops endpoints.
#
# Used by /internal/* (epoch receiver) and /miner-dispatcher/validate*.
# The header value is checked against the node's INTERNAL_SECRET env var.
# If INTERNAL_SECRET is unset, auth is DISABLED (dev-only convenience —
# must be set in production).
type: apiKey
in: header
name: X-Internal-Secret
description: |
  Shared secret for trusted-internal calls. The header value must match the
  node's `INTERNAL_SECRET` environment variable.

  **Development:** if `INTERNAL_SECRET` is unset, authentication is disabled
  (these endpoints become open). This is a dev convenience.

  **Production:** `INTERNAL_SECRET` MUST be set. These endpoints are
  internal-only and should not be exposed on the public internet without
  additional network-level isolation.

  Used by:
  - `POST /internal/delivery` (engine → epoch receiver)
  - `POST /internal/epoch-close` (engine → epoch receiver)
  - `GET /internal/epoch/current`
  - `POST /miner-dispatcher/validate` (miner YAML sandbox validation)
  - `POST /miner-dispatcher/validate/collector`
