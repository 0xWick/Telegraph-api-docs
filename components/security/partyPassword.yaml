# TSS workflow party password.
#
# Used by /validator/start (keygen) and /validator/reshare. The request body
# is a full config.Config JSON object whose `PartyPassword` field must match
# the node's own `PartyPassword` config value.
#
# This is a weak shared-secret scheme — it exists to prevent accidental
# triggering of expensive TSS workflows by unauthenticated callers. It is
# NOT a substitute for network-level access control. The /validator/* routes
# should be restricted to peer validators at the network layer.
type: apiKey
in: header
name: X-Party-Password
description: |
  Party password for TSS (threshold signature scheme) workflows. The header
  value must match the node's `PartyPassword` configuration.

  Note: in the current implementation, the password is also embedded in the
  request body (as `config.PartyPassword`). The header form is the
  recommended going-forward interface. If the body's `PartyPassword` does not
  match the node's config, the request is rejected with `403`.

  Used by:
  - `POST /validator/start` (TSS distributed key generation)
  - `POST /validator/reshare` (TSS key resharing for validator set changes)

  Not used by `/validator/sign` (signing is triggered by other mechanisms)
  or `/validator/update` (raw TSS update bytes, no password check).
